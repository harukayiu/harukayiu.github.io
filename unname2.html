<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Facebook Plugin 測試</title>
</head>
<body>
  <!-- Facebook SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous" 
    src="https://connect.facebook.net/zh_TW/sdk.js#xfbml=1&version=v17.0"></script>

  <!-- Facebook Page Plugin -->
  <div class="fb-page" 
       data-href="https://www.facebook.com/y.haruka" 
       data-tabs="timeline" 
       data-width="340" 
       data-height="500" 
       data-small-header="false" 
       data-adapt-container-width="true" 
       data-hide-cover="false" 
       data-show-facepile="true">
  </div>
</body>
</html>

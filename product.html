<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>HARUKA創漫工房–同人組織</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h2 { margin-bottom: 10px; }
    .filter-bar { margin-bottom: 20px; }
    select, input { margin-right: 10px; padding: 5px; }
 .product-grid {
  display: grid;
  grid-template-columns: repeat(4, auto); /* 固定 4 欄，每欄寬度依卡片尺寸 */
  justify-content: center; /* 置中排列 */
  gap: 20px; /* 卡片間距 */
}

.product-card {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  width: 200px;   /* 固定卡片寬度 */
  height: auto;   /* 高度依內容 */
}
   .product-card:hover { transform: scale(1.05); }
    .product-card img { max-width: 100%; height: auto; border-radius: 4px; }
    .detail-card { text-align: center; margin-top: 20px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .detail-card img { max-width: 600px; max-height: 600px; width: auto; height: auto; margin-bottom: 20px; }
    button { margin-bottom: 20px; padding: 8px 16px; border: none; background: #007bff; color: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  .auto-style1 {
	  font-family: 微軟正黑體;
  }
  </style>
</head>
<body>

  <h2 class="auto-style1">HARUKA創漫工房</h2>
  <p>瀏覽 HARUKA創漫工房–同人組織的所有商品</p>

  <!-- 篩選欄位 -->
  <div class="filter-bar">
    <label>作品類別：</label>
    <select id="workFilter">
      <option value="all">全部</option>
    </select>

    <label>商品類別：</label>
    <select id="typeFilter">
      <option value="all">全部</option>
    </select>

    <input type="text" id="searchBox" placeholder="搜尋商品名稱">
  </div>

  <!-- 商品列表 -->
  <div class="product-grid" id="productList"></div>

  <!-- 商品詳細頁 -->
  <div id="productDetail" style="display:none;">
    <button onclick="closeDetail()">返回商品列表</button>
    <div class="detail-card">
      <img id="detailImg" src="" alt="">
      <h2 id="detailName"></h2>
      <p id="detailPrice"></p>
      <p id="detailDesc"></p>
    </div>
  </div>

  <script>
    const sheetId = "12fQ7S_lmJIC-cmbyGSszoEFKvdVp0T4fvpNgTO85_io"; 
    const apiKey = "AIzaSyCGYTWk0YJLIcVyZhIAzYlqS8uB8W9wmsM";       
    const range = "products!A:E"; // A 到 E 欄

    let products = [];

    async function loadProducts() {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${apiKey}`;
      const response = await fetch(url);
      const data = await response.json();
      const rows = data.values;

      products = rows.slice(1).map(row => ({
        work: row[0],     // 作品類別 (A)
        type: row[1],     // 商品類別 (B)
        price: parseFloat(row[2]), // 價格 (C)
        detail: row[3],   // 商品詳情 (D)
        img: row[4]       // 圖片檔名 (E)
      }));

      // 動態建立分類選項
      const works = [...new Set(products.map(p => p.work))];
      const types = [...new Set(products.map(p => p.type))];

      const workFilter = document.getElementById("workFilter");
      works.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        workFilter.appendChild(opt);
      });

      const typeFilter = document.getElementById("typeFilter");
      types.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        typeFilter.appendChild(opt);
      });

      renderProducts("all", "all", "");
    }

    function renderProducts(workFilter, typeFilter, keyword) {
      const list = document.getElementById("productList");
      list.innerHTML = "";
      products
        .filter(p => workFilter === "all" || p.work === workFilter)
        .filter(p => typeFilter === "all" || p.type === typeFilter)
        .filter(p => !keyword || p.work.includes(keyword) || p.type.includes(keyword))
        .forEach((p,i) => {
          list.innerHTML += `
            <div class="product-card" onclick="showDetail(${i})">
              <img src="product/${p.img}" alt="${p.work} - ${p.type}">
              <h3>${p.work} (${p.type})</h3>
              <p>HK$${p.price}</p>
            </div>
          `;
        });
    }

function showDetail(index) {
  const p = products[index];
  document.getElementById("detailImg").src = "product/" + p.img;
  
  // 用表格顯示商品詳情
document.getElementById("detailDesc").innerHTML = `
  <table style="margin:auto; border-collapse: collapse; width:40%;">
    <tr>
      <td style="border:1px solid #ddd; padding:8px; width:150px; font-weight:bold;">作品類別</td>
      <td style="border:1px solid #ddd; padding:8px;">${p.work}</td>
    </tr>
    <tr>
      <td style="border:1px solid #ddd; padding:8px; width:150px; font-weight:bold;">商品類別</td>
      <td style="border:1px solid #ddd; padding:8px;">${p.type}</td>
    </tr>
    <tr>
      <td style="border:1px solid #ddd; padding:8px; width:150px; font-weight:bold;">價格</td>
      <td style="border:1px solid #ddd; padding:8px;">HK$${p.price}</td>
    </tr>
    <tr>
      <td style="border:1px solid #ddd; padding:8px; width:150px; font-weight:bold;">商品詳情</td>
      <td style="border:1px solid #ddd; padding:8px; text-align:left;">${p.detail}</td>    
    </tr>
  </table>
`;

  document.getElementById("productList").style.display = "none";
  document.getElementById("productDetail").style.display = "block";
}

    function closeDetail() {
      document.getElementById("productDetail").style.display = "none";
      document.getElementById("productList").style.display = "grid";
    }

    // 篩選事件
    document.getElementById("workFilter").addEventListener("change", e => {
      renderProducts(e.target.value, document.getElementById("typeFilter").value, document.getElementById("searchBox").value);
    });
    document.getElementById("typeFilter").addEventListener("change", e => {
      renderProducts(document.getElementById("workFilter").value, e.target.value, document.getElementById("searchBox").value);
    });
    document.getElementById("searchBox").addEventListener("input", e => {
      renderProducts(document.getElementById("workFilter").value, document.getElementById("typeFilter").value, e.target.value);
    });

    loadProducts();
  </script>

</body>
</html>

</body>

</html>
